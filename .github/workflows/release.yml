# Builds dota2-tiktok-overlay.exe from the sources in this repository with PyInstaller.
# - Actions -> Build exe -> Run workflow with a version (e.g. v1.2.0): builds the exe, creates that tag
#   and a release on the current commit and attaches the exe. GitHub shows its SHA-256 next to the file.
# - Run workflow with an empty version: only builds the exe and keeps it as a run artifact.
# - Publishing a release by hand also works: the exe is attached to that release.
name: Build exe

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.2.0 (empty = only build the exe)"
        required: false
        type: string
      notes:
        description: "Release notes (optional; the list of commits is added automatically)"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write  # create the tag/release and upload the exe

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+$') { throw "Version must look like v1.2.0, got '$env:VERSION'" }
          gh release view $env:VERSION *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:VERSION already exists" }
          $global:LASTEXITCODE = 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.21.0

      - name: Build exe
        run: >
          python -m PyInstaller --onefile --console --name dota2-tiktok-overlay
          --add-data "overlay.js;." --add-data "config.json;." --add-data "page.css;."
          build.py

      - name: Smoke test
        # the game is not installed here, so only check that the exe starts and parses arguments
        run: dist\dota2-tiktok-overlay.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: dota2-tiktok-overlay
          path: dist/dota2-tiktok-overlay.exe

      - name: Create release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: pwsh
        run: |
          $notesArgs = if ($env:NOTES) { @('--notes', $env:NOTES) } else { @() }
          gh release create $env:VERSION dist/dota2-tiktok-overlay.exe --target $env:GITHUB_SHA --title $env:VERSION --generate-notes @notesArgs

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        run: gh release upload "${{ github.event.release.tag_name }}" dist/dota2-tiktok-overlay.exe --clobber
